server:
  port: 8083

spring:
  application:
    name: baseline-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/baseline_db}
    username: ${SPRING_DATASOURCE_USERNAME:baseline_user}
    password: ${SPRING_DATASOURCE_PASSWORD:baseline_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

app:
  kafka:
    topic: soa.s10.t02.events
  baseline:
    default-threshold-percent: 50.0
    night-window-start: 1
    night-window-end: 5
